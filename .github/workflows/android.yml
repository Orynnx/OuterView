name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Hello Card package
        run: python demo/hello-card/build_card.py --check
      - name: Audit REAREye source separation
        run: |
          git clone --filter=blob:none https://github.com/killerprojecte/REAREye.git .audit/REAREye
          python tools/audit_reareye_similarity.py --reareye .audit/REAREye
      - name: Test and build
        run: ./gradlew :core:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Audit runtime dependency licenses
        shell: pwsh
        run: ./tools/verify-runtime-licenses.ps1 -GradleExecutable ./gradlew
      - uses: actions/upload-artifact@v4
        with:
          name: OuterView-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
